services:
  redis:
    image: redis:7-alpine
    container_name: glug_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  chatbot:
    build: .
    container_name: glug_chatbot_app
    ports:
      - "8000:80"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped